title: Footer
tabs:
  footer:
    display: Footer
    sections:
      -
        fields:
          -
            handle: content_tab
            field: common.content_tab
            config:
              display: Content
          - import: footer_widgets
          -
            handle: style_tab
            field: common.style_tab
            config:
              display: Style
          -
            handle: columns_tab
            field:
              style: accordion
              tab_icon: 'material-symbols:stacks-outline'
              type: tab
              display: Kolonner
          -
            handle: columns
            field:
              min: 1
              max: 4
              default: 4
              sve_defaults:
                tablet: 2
                mobile: 1
              type: range
              display: Kolonner
              instructions: 'Antal widgets ved siden af hinanden. Kan sættes for sig på tablet og mobil.'
              sve_responsive: true
          -
            handle: dividers
            field:
              type: toggle
              display: 'Streger mellem kolonner'
              default: true
          -
            handle: colors_tab
            field: common.colors_tab
            config:
              display: Colors
          -
            handle: bg_color
            field:
              type: theme_color_picker
              display: 'Bg color'
              default: 'var(--gray-300)'
          -
            handle: spacing_tab
            field: common.spacing_tab
            config:
              display: Spacing
          -
            handle: padding
            field:
              max: 12
              step: 2
              type: spacing
              display: Padding
              default:
                -
                  sides:
                    - top
                    - bottom
                  value: 8
                  custom: false
          -
            handle: gap
            field:
              max: 12
              step: 2
              type: gap
              display: Gap
              default:
                -
                  axes:
                    - 'y'
                    - x
                  value: 8
                  custom: false
