title: Footer
tabs:
  footer:
    display: Footer
    sections:
      -
        fields:
          -
            handle: style_tab
            field: common.style_tab
            config:
              display: Style
          -
            handle: colors_tab
            field: common.colors_tab
            config:
              display: Colors
          -
            handle: bg_color
            field:
              type: theme_color_picker
              display: 'Bg color'
              default: 'var(--gray-300)'
          -
            handle: spacing_tab
            field: common.spacing_tab
            config:
              display: Spacing
          -
            handle: padding
            field:
              max: 12
              step: 2
              type: spacing
              display: Padding
              default:
                -
                  sides:
                    - top
                    - bottom
                  value: 8
                  custom: false
