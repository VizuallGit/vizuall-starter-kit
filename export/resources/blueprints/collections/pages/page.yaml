title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          - import: page_sections
          -
            handle: upload_video_field
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Upload video Field'
          -
            handle: assets_field
            field:
              container: assets
              max_files: 10
              type: assets
              display: 'Assets Field'
  sidebar:
    display: 'Page Settings'
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
  seo:
    display: SEO
    sections:
      -
        fields:
          - import: meta
            prefix: meta_
