<header class="wrapper" data-sve-chrome="header" data-sve-chrome-label="Header">
  <div class="flex flex-col items-center gap-y-300 py-500 text-center">
    <a href="/" aria-label="{{ site_settings:site_name }}" class="font-bold text-xl">
      {{ if site_head:logo }}<img src="{{ site_head:logo }}" alt="" class="h-600 w-auto">{{ else }}{{ site_settings:site_name ?? 'Logo' }}{{ /if }}
    </a>
    <nav aria-label="Primær navigation">
      <ul class="flex flex-wrap justify-center gap-x-[1.5em] font-bold">
        {{ nav:collection:pages max_depth="1" }}
          <li><a href="{{ url }}">{{ title }}</a></li>
        {{ /nav:collection:pages }}
      </ul>
    </nav>
  </div>
</header>
