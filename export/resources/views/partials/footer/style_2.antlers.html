{{# Centered stack #}}
<div class="[ site-foot ] wrapper flex flex-col items-center gap-700 text-center py-900">
    {{ site_foot.footer_widgets }}
        <div class="w-full max-w-prose">
            {{ if type == 'navigation' }}
                {{ partial:widgets/footer_navigation }}
            {{ else }}
                {{ partial src="widgets/{type}" }}
            {{ /if }}
        </div>
    {{ /site_foot.footer_widgets }}
</div>
