title: 'Footer widgets'
fields:
  -
    handle: footer_widgets
    field:
      type: replicator
      display: 'Footer widgets'
      collapse: accordion
      button_label: 'Tilføj widget'
      localizable: false
      max_sets: 4
      sets:
        widget:
          display: Widget
          sets:
            contact_info:
              display: 'Contact info'
              icon: 'lucide:contact'
              fields:
                - import: widgets.contact_info
            navigation:
              display: Navigation
              icon: 'lucide:link'
              fields:
                - import: widgets.footer_navigation
            opening_hours:
              display: Åbningstider
              icon: 'lucide:clock'
              fields:
                - import: widgets.opening_hours
            form:
              display: Form
              icon: 'lucide:send'
              fields:
                - import: widgets.form
