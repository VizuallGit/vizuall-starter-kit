title: 'Footer navigation widget'
fields:
  -
    handle: content_tab
    field: common.content_tab
    config:
      display: Content
  -
    handle: title
    field:
      type: text
      display: Overskrift
      localizable: false
  -
    handle: navigation_type
    field:
      options:
        -
          key: pages
          value: Sider
        -
          key: custom
          value: 'Egen navigation'
      default: pages
      type: button_group
      display: 'Hvor kommer linkene fra'
  -
    handle: include_homepage
    field:
      type: toggle
      display: 'Vis forsiden med'
      if:
        navigation_type: 'equals pages'
  -
    handle: navigation_picker
    field:
      max_items: 1
      type: navs
      display: Navigation
      if:
        navigation_type: 'equals custom'
  -
    handle: max_depth
    field:
      type: range
      display: 'Antal niveauer'
      min: 1
      max: 3
      default: 1
