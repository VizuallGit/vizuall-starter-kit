title: Common
fields:
  -
    handle: settings
    field:
      type: tabby
      display: Settings
      fields:
        -
          handle: tab_colors
          field:
            type: tab
            display: Farver
        -
          handle: bg_color
          field:
            type: theme_color_picker
            display: 'Bg color'
        -
          handle: tab_spacing
          field:
            type: tab
            display: Spacing
        -
          handle: padding
          field: common.section_spacing
          config:
            display: Padding
        -
          handle: custom_css
          field:
            type: tab
            display: 'Custom css'
        -
          handle: css
          field:
            type: code
            mode: css
            mode_selectable: false
            display: Css
            instructions: 'Skriv :root for at taget section id/class'
  -
    handle: spacing
    field:
      max: 6
      type: spacing
      display: Spacing
  -
    handle: font_weight
    field:
      options:
        - key: 300
          value: Light
        - key: 400
          value: Regular
        - key: 500
          value: Medium
        - key: 600
          value: Semibold
        - key: 700
          value: Bold
        - key: 800
          value: 'Extra bold'
      default: '400'
      type: select
      display: 'Font weight'
  -
    handle: font_size
    field:
      options:
        - key: text-100
          value: '100'
        - key: text-200
          value: '200'
        - key: text-300
          value: '300'
        - key: text-400
          value: '400'
        - key: text-500
          value: '500'
        - key: text-600
          value: '600'
        - key: text-700
          value: '700'
        - key: text-800
          value: '800'
        - key: text-900
          value: '900'
      placeholder: 'Vælg font størrelse'
      clearable: true
      type: select
      display: 'Font size'
  -
    handle: line_height
    field:
      options:
        - key: leading-none
          value: 1%
        - key: leading-flat
          value: 1.15%
        - key: leading-tight
          value: 1.25%
        - key: leading-snug
          value: 1.375%
        - key: leading-normal
          value: '1.5'
        - key: leading-relaxed
          value: 1.625%
        - key: leading-loose
          value: 2%
      default: leading-normal
      type: select
      display: 'Line height'
  -
    handle: position
    field:
      options:
        - key: relative
          value: Normal
        - key: fixed
          value: Fixed
        - key: sticky
          value: Sticky
      type: button_group
      display: Position
      default: relative
  -
    handle: font_family
    field:
      type: font_family_selector
      display: 'Font family'
  -
    handle: opacity
    field:
      options:
        - key: 0%
          value: 0%
        - key: 10%
          value: 10%
        - key: 20%
          value: 20%
        - key: 30%
          value: 30%
        - key: 40%
          value: 40%
        - key: 50%
          value: 50%
        - key: 60%
          value: 60%
        - key: 70%
          value: 70%
        - key: 80%
          value: 80%
        - key: 90%
          value: 90%
        - key: 100%
          value: 100%
      type: select
      display: Opacity
      default: 50%
  -
    handle: aspect_ratio
    field:
      options:
        - key: aspect-1/1
          value: '1/1 - Firekantet'
        - key: aspect-4/3
          value: 4/3
        - key: aspect-16/9
          value: '16/9 - Video format'
        - key: aspect-3/4
          value: 3/4
      default: aspect-4/3
      type: select
      display: 'Aspect ratio'
  -
    handle: offset
    field:
      options:
        - key: none
          value: None
        - key: sm
          value: Small
        - key: md
          value: Medium
        - key: lg
          value: Large
      default: none
      type: select
      display: Offset
  -
    handle: simple_text
    field:
      buttons:
        - h1
        - h2
        - h3
        - bold
        - italic
        - unorderedlist
        - orderedlist
        - removeformat
        - anchor
        - horizontalrule
        - title
      container: assets
      remove_empty_nodes: false
      type: bard
      display: 'Simple text'
  -
    handle: section_heading
    field:
      buttons:
        - h2
        - h3
        - bold
        - italic
        - removeformat
        - quote
        - anchor
        - title
      container: assets
      remove_empty_nodes: false
      type: bard
      display: 'Section heading'
      default:
        -
          type: heading
          attrs:
            level: 2
          content:
            - type: text
              text: Overskrift
        -
          type: paragraph
          content:
            - type: text
              text: 'Indtast din tekst'
  -
    handle: section_spacing
    field:
      max: 12
      step: 3
      type: spacing
      display: 'Section spacing'
      default:
        -
          sides:
            - top
            - bottom
          value: 9
          custom: false
  -
    handle: font_width
    field:
      options:
        - key: 50
          value: 'Ultra narrow'
        - key: 60
          value: 'Extra narrow'
        - key: 70
          value: Narrow
        - key: 90
          value: Tight
        - key: 100
          value: Normal
        - key: 110
          value: Relaxed
        - key: 120
          value: Loss
        - key: 130
          value: Wide
        - key: 140
          value: 'Extra wide'
        - key: 150
          value: 'Ultra wide'
      default: '100'
      type: select
      display: 'Font width'
  -
    handle: size
    field:
      options:
        - key: sm
          value: Small
        - key: md
          value: Medium
        - key: lg
          value: Large
      default: md
      type: select
      display: Size
  -
    handle: animations
    field:
      options:
        - key: none
          value: None
        - key: fadce-in
          value: 'Fade in'
        - key: fade-up
          value: 'Fade up'
        - key: fade-down
          value: 'Fade down'
      type: select
      display: Animations
      default: none
  -
    handle: flow_space
    field:
      options:
        - key: flow-space-auto
          value: auto
        - key: flow-space-05em
          value: 05em
        - key: flow-space-1em
          value: 1em
        - key: flow-space-1-5em
          value: 1.5em
        - key: flow-space-2em
          value: 2em
        - key: flow-space-100
          value: '100'
        - key: flow-space-200
          value: '200'
        - key: flow-space-300
          value: '300'
        - key: flow-space-400
          value: '400'
        - key: flow-space-500
          value: '500'
        - key: flow-space-600
          value: '600'
        - key: flow-space-700
          value: '700'
      type: select
      display: 'Flow space'
      placeholder: 'Select block gap'
      clearable: true
      taggable: true
      default: flow-space-auto
      sve_sync_siblings: true
  -
    handle: content_tab
    field:
      type: tab
      display: 'Content tab'
      tab_icon: text
  -
    handle: style_tab
    field:
      type: tab
      display: 'Style tab'
      tab_icon: 'codicon:color-mode'
  -
    handle: advance_tab
    field:
      type: tab
      display: 'Advance tab'
      tab_icon: code
  -
    handle: colors_tab
    field:
      style: accordion
      type: tab
      display: Colors_tab
      tab_icon: 'material-symbols:invert-colors-outline'
  -
    handle: spacing_tab
    field:
      style: accordion
      type: tab
      display: 'Spacing tab'
      tab_icon: spacing
  -
    handle: gap
    field:
      max: 12
      step: 2
      type: gap
      display: Gap
      default:
        -
          axes:
            - 'y'
            - x
          value: 8
          custom: false
  -
    handle: align_text
    field:
      options:
        - id: JmoVJhN71hTFTxyXiKwmJ
          key: left
          label: Left
          icon: paragraph-align-left
        - id: DO5WNEc53PnIyWAeMTCV_
          key: center
          label: Center
          icon: paragraph-align-center
        - id: ESAbceZjG1jW49H2euZSe
          key: right
          label: Right
          icon: paragraph-align-right
      default: left
      type: icon_button_group
      display: 'Align text'
      hide_display: true
      sve_responsive: true
  -
    handle: h_tag
    field:
      options:
        - key: h1
          value: H1
        - key: h2
          value: H2
        - key: h3
          value: H3
        - key: h4
          value: H4
      default: h2
      type: button_group
      display: 'Heading tag'
  -
    handle: font_size_tab
    field:
      style: accordion
      tab_icon: 'streamline-ultimate:font-size-bold'
      type: tab
      display: 'Font size tab'
  -
    handle: border_radius_tab
    field:
      style: accordion
      tab_icon: 'bx:border-radius'
      type: tab
      display: 'Border radius tab'
  -
    handle: headings_tag_tab
    field:
      style: accordion
      tab_icon: 'fa-solid:heading'
      type: tab
      display: 'Heading tag tab'
  -
    handle: flow_space_tab
    field:
      style: accordion
      tab_icon: 'gg:space-between-v'
      type: tab
      display: 'Flow space tab'
