title: 'Page sections'
fields:
  -
    handle: page_sections
    field:
      type: replicator
      display: 'Page sections'
      collapse: accordion
      sets:
        hero:
          display: Hero
          sets:
            hero/style_2:
              display: 'Hero style 2'
              icon: 'lucide:panel-top'
              image: hero-style-2-2a5425e5.png
              fields:
                - import: hero.style_2
            hero/hero_style_1:
              display: 'Hero style 1'
              fields:
                - import: hero.hero_style_1
              image: hero-hero-style-1-719b5a3b.png
        galleries:
          display: Galleries
          sets:
            gallery/style_1:
              display: 'Galleri style 1'
              fields:
                - import: gallery.style_1
              image: gallery-style-1-cdf8332f.png
        content_sections:
          display: 'Content sections'
          sets:
            content_section/basic_content_links:
              display: 'Basic content with links'
              icon: 'fluent:text-align-center-24-regular'
              fields:
                - import: content_section.basic_content_links
              image: content-section-basic-content-links-b70a80af.png
            content_section/style_1:
              display: 'Content section style 1'
              image: content-section-style-1-97cca857.png
              fields:
                - import: content_section.style_1
            media_textbox/style_1:
              display: 'Media textbox style 1'
              image: media-textbox-style-1-57e215e2.png
              fields:
                - import: media_textbox.style_1
        featured_sections:
          display: 'Featured sections'
          sets:
            featured_section/feature_list_icons:
              display: 'Feature list with icons'
              icon: 'lucide:list-checks'
              fields:
                - import: featured_section.feature_list_icons
              image: featured-section-feature-list-icons-084104c6.png
            featured_section/style_1:
              display: 'Featured section Style 1'
              image: featured-section-style-1-c356dde9.png
              fields:
                - import: featured_section.style_1
            new_set:
              display: 'New Set'
              fields: {}
        other_sections:
          display: 'Other sections'
          sets:
            form_section/style_1:
              display: 'Media Form Box'
              icon: 'lucide:mail'
              fields:
                - import: form_section.style_1
              image: form-section-style-1-ad105c13.png
            accordion_section/style_1:
              display: FAQ
              icon: 'lucide:message-circle-question'
              fields:
                - import: accordion_section.style_1
              image: accordion-section-style-1-403a8c05.png
            global_section:
              display: 'Global section'
              hide: true
              fields:
                -
                  handle: global_section
                  field:
                    collections:
                      - saved_sections
                    max_items: 1
                    type: entries
                    display: 'Global section'
            event_list:
              display: 'Event list'
              image: event-list-be387251.png
              fields:
                - import: event_list
            other_section/employees_list_2:
              display: 'Employees list'
              fields:
                - import: other_section.employees_list_2
              image: other-section-employees-list-2-98cb33e9.png
            other_section/team:
              display: Team
              fields:
                - import: other_section.team
        static_sections:
          display: 'Static sections'
          sets:
            static_section/jhjgjjjjjjj:
              display: jhjgjjjjjjj
              static: true
              fields: {}
              image: static-section-jhjgjjjjjjj-b9c5d41b.png
